# Works around a known testcontainers-java/docker-java incompatibility with
# Docker Engine 29+ (testcontainers/testcontainers-java#11210, #11212, #11360):
# the bundled docker-java client hardcodes Docker API version 1.32, which
# Docker 29's MinAPIVersion=1.40 rejects with a blank-stub HTTP 400 before any
# container ever starts. Pinning a version inside the daemon's supported range
# (1.40-1.54 as of this Docker Desktop release) fixes negotiation.
api.version=1.44
