port = 8080
port = ${?ORDER_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?ORDER_SERVICE_METRICS_PORT}

service-name = "order-service"
service-name = ${?ORDER_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "order"
  database = ${?POSTGRES_DB}
  user = "order"
  user = ${?POSTGRES_USER}
  password = "order"
  password = ${?POSTGRES_PASSWORD}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

  # Message-processing retry before a message is routed to <topic>-dlq -
  # deliberately much shorter/bounded than stream-supervisor below: this is
  # "retry processing this one message a few times," not "back off a whole
  # crashed stream."
  dlq-retry {
    max-retries = 3
    base-delay = 200ms
  }

  # Guards the DLQ's own publish call (purekafka's DeadLetter, ADR 0010) -
  # same shape as inventory-client.resilience above, for a different single
  # call.
  dlq-publish-resilience {
    retry {
      max-retries = 3
      base-delay = 100ms
    }
    circuit-breaker {
      failure-threshold = 5
      reset-timeout = 30s
    }
  }

  # Restart-with-backoff for a crashed consumer stream (TD-2.2, ADR 0010) -
  # 30s is the ceiling exponential backoff grows to, not something this
  # service needed to re-decide.
  stream-supervisor {
    base-delay = 1s
    max-delay = 30s
  }
}

# Order-history cache (US-8.1). Cache-aside, TTL-only freshness - no explicit
# invalidation on write (checkout, status update), so a write can take up to
# history-ttl-seconds to show up in a cached list.
redis {
  uri = "redis://localhost:6379"
  uri = ${?REDIS_URI}
  history-ttl-seconds = 60
  history-ttl-seconds = ${?ORDER_HISTORY_CACHE_TTL_SECONDS}
}

# Synchronous stock-reservation call to inventory-service (US-4.2). base-url
# defaults to inventory-service's local docker-compose port; in k8s, cluster
# DNS resolves a plain service name instead (see system-design.md's "Service
# discovery & ports").
inventory-client {
  base-url = "http://localhost:8081"
  base-url = ${?INVENTORY_SERVICE_URL}
  resilience {
    retry {
      max-retries = 3
      base-delay = 100ms
    }
    circuit-breaker {
      failure-threshold = 5
      reset-timeout = 30s
    }
  }
}

# Synchronous authorize call to payment-service (US-14.2, ADR 0018) - same
# shape as inventory-client above, with its own breaker. 8082 is a local
# default only; k8s sets PAYMENT_SERVICE_URL.
payment-client {
  base-url = "http://localhost:8082"
  base-url = ${?PAYMENT_SERVICE_URL}
  resilience {
    retry {
      # No retries until payment-service dedupes authorize by orderId: a retry
      # whose first attempt landed would place a second hold.
      max-retries = 0
      base-delay = 100ms
    }
    circuit-breaker {
      failure-threshold = 5
      reset-timeout = 30s
    }
  }
}

# example-client is not read by the live service (order-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
