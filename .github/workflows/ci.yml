name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      # GITHUB_TOKEN is the built-in, same-repo-scoped token GitHub Actions provides
      # automatically - it can't resolve GitHub Packages published from a *different*
      # repo (purerestlib is published from beckfordp/purerest), so this build's
      # GITHUB_TOKEN comes from a repository secret (GH_PACKAGES_TOKEN, a PAT with
      # read:packages scope) instead.
      - name: scalafmtCheck + test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: sbt scalafmtCheck Test/scalafmtCheck test
